services:
  - type: web
    name: insightai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true"
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true